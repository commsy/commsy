{{- if and .Values.persistence.files.enabled (not .Values.persistence.files.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "commsy.filesClaim" . }}
  labels:
    {{- include "commsy.labels" . | nindent 4 }}
  {{- with .Values.persistence.files.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.files.accessMode }}
  {{- with .Values.persistence.files.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.files.size }}
{{- end }}
