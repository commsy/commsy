# The application and the web server are one process now: FrankenPHP embeds
# Caddy, so there is no separate web container and no socket between them.
x-app-environment: &app-environment
  DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@db:3306/${MYSQL_DB:-app}?serverVersion=${MYSQL_VERSION:-11.8.5-MariaDB}&charset=${MYSQL_CHARSET:-utf8mb4}

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql:rw
    environment:
      - MARIADB_AUTO_UPGRADE=1
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=commsy
      - MYSQL_USER=commsy
      - MYSQL_PASSWORD=commsy

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    restart: unless-stopped
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    environment:
      - "discovery.type=single-node"
      - "bootstrap.memory_lock=true"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      # Reachable only inside the compose network. A cluster of its own enables
      # security there and passes credentials and CA through ELASTICSEARCH_URL
      # and ELASTICSEARCH_CA.
      - "xpack.security.enabled=false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 10s
      retries: 30

  php:
    image: commsy/php
    build:
      context: .
      target: commsy_php_prod
    depends_on:
      - db
      - elastic
    restart: unless-stopped
    environment:
      <<: *app-environment
      # The second name lets sibling containers reach us by service name; it is
      # what INTERNAL_BASE_URL points at.
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - commsy_data:/app/files
    ports:
      # HTTP
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      # HTTPS
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp

  worker:
    image: commsy/php
    build:
      context: .
      target: commsy_php_prod
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped
    environment:
      <<: *app-environment
      # The schema update belongs to whichever container serves the site.
      COMMSY_SKIP_INIT: "1"
    volumes:
      - commsy_data:/app/files
    command: ["php", "bin/console", "messenger:consume", "--all", "--time-limit=3600"]
    # One consumer per container, so the count that supervisord carried as
    # numprocs lives here. Override with `docker compose up --scale worker=N`.
    deploy:
      replicas: 2
    # The image's health check asks FrankenPHP's admin API, which this
    # container never starts.
    healthcheck:
      disable: true

volumes:
  caddy_data:
  caddy_config:
  db_data:
  elasticsearch_data:
  commsy_data:
