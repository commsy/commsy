name: CI

on:
    workflow_dispatch:
    push:
    pull_request:

jobs:
    test:
        name: Run Tests
        env:
            APP_ENV: test
            DATABASE_URL: mysql://root:root@127.0.0.1:3306/app
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php-versions: ['8.4']
        services:
            db:
                image: mariadb:11.8
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: app_test
                    MYSQL_USER: app
                    MYSQL_PASSWORD: '!ChangeMe!'
                ports:
                    - 3306:3306
        steps:
            -   name: actions/checkout
                uses: actions/checkout@v4

            -   name: Setup node
                uses: actions/setup-node@v5
                with:
                    # Same major as the container image; Encore 7 wants >= 22.18
                    node-version: '22'

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-versions }}
                    extensions: zip, imap, ldap, apcu
                    ini-values: apc.enable_cli=1, date.timezone=Europe/Berlin
                    tools: composer:v2

            -   name: Install php deps
                run: composer install --no-progress

            -   name: Generate JWT keypair
                run: bin/console lexik:jwt:generate-keypair

            -   name: Install node deps
                run: npm ci

            -   name: Build frontend package
                run: npm run build

            -   name: Run tests
                run: vendor/bin/simple-phpunit

            -   name: Setup tmate session
                if: ${{ failure() }}
                uses: mxschmitt/action-tmate@v3
                timeout-minutes: 15
                with:
                  limit-access-to-actor: true

    smoke:
        name: Start the production image
        needs: test
        runs-on: ubuntu-latest
        # The production image runs rootless while the development one runs as
        # root, so a permission problem that only exists rootless cannot show up
        # in the test suite. This job starts the real image and lets its own
        # entrypoint run: key generation, migrations, then serving. Skipping the
        # initialisation would defeat the purpose — that is the part that breaks.
        services:
            db:
                image: mariadb:11.8
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: app_smoke
                    MYSQL_USER: app
                    MYSQL_PASSWORD: '!ChangeMe!'
                ports:
                    - 3306:3306
        steps:
            -   name: actions/checkout
                uses: actions/checkout@v4

            -   name: Set up Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Build the production image
                uses: docker/build-push-action@v6
                with:
                    context: .
                    target: commsy_php_prod
                    load: true
                    tags: commsy:smoke
                    cache-from: type=gha
                    cache-to: type=gha,mode=max

            -   name: Start it and wait until it serves
                run: |
                    docker run -d --name smoke --network host \
                        -e SERVER_NAME=:8088 \
                        -e APP_ENV=prod \
                        -e APP_SECRET=smoke-only \
                        -e DATABASE_URL='mysql://app:!ChangeMe!@127.0.0.1:3306/app_smoke?serverVersion=11.8.5-MariaDB&charset=utf8mb4' \
                        commsy:smoke
                    for i in $(seq 1 60); do
                        state=$(docker inspect -f '{{.State.Health.Status}}{{if not .State.Running}} (exited){{end}}' smoke)
                        case "$state" in
                            healthy) echo "The image serves."; exit 0 ;;
                            *exited*) echo "The container died:"; docker logs smoke; exit 1 ;;
                        esac
                        sleep 5
                    done
                    echo "Still not healthy after five minutes:"
                    docker logs smoke
                    exit 1

            -   name: Show the log when it did not come up
                if: ${{ failure() }}
                run: docker logs smoke || true

    release-docker:
        name: Create and push docker images
        needs: [test, smoke]
        runs-on: ubuntu-latest
        steps:
            - name: actions/checkout
              uses: actions/checkout@v4

            - name: Login to DockerHub
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # Application image
            #
            # FrankenPHP serves the site itself, so the separate web image is
            # gone and this one drops the -php-fpm suffix along with it.
            - name: docker/metadata-action
              uses: docker/metadata-action@v5
              id: meta_app
              with:
                  images: |
                      effectivewebwork/commsy
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{major}}.{{minor}}

            - name: Build application image and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: ${{ github.event_name != 'pull_request' }}
                  target: commsy_php_prod
                  tags: ${{ steps.meta_app.outputs.tags }}
                  labels: ${{ steps.meta_app.outputs.labels }}

            # elasticsearch image
            - name: docker/metadata-action
              uses: docker/metadata-action@v5
              id: meta_elastic
              with:
                  images: |
                      effectivewebwork/commsy
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{major}}.{{minor}}
                  flavor: |
                      suffix=-elastic,onlatest=true

            - name: Build elasticsearch image and push
              uses: docker/build-push-action@v6
              with:
                  context: ./docker/elasticsearch
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta_elastic.outputs.tags }}
                  labels: ${{ steps.meta_elastic.outputs.labels }}
