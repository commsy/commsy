# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "gd"
    
    twig:
        mode: "lazy"

    resolvers:
        default:
            web_path: ~

    filter_sets:
        cache: ~
        commsy_user_image:
            quality: 100
            filters:
                thumbnail: { size: [ 200, 200 ], mode: outbound }

    # Filters run only in code (the user picture); no route resolves them, so
    # nothing in the files directory is reachable through the bundle.
    loaders:
        default:
            filesystem:
                data_root: '%files_directory%'
