vich_uploader:
    db_driver: orm
    
    metadata:
        type: attribute

    mappings:
        portal_logo:
            uri_prefix: /files/portal/logos
            upload_destination: '%kernel.project_dir%/files/portal/logos'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: true

        server_logo:
            uri_prefix: /files/server
            upload_destination: '%kernel.project_dir%/files/server'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: true
        
        temp_user:
            upload_destination: '%kernel.project_dir%/files/temp/user'
            directory_namer:
                service: Vich\UploaderBundle\Naming\PropertyDirectoryNamer
                options:
                    property: 'id'
                    transliterate: true
            namer:
                service: Vich\UploaderBundle\Naming\PropertyNamer
                options:
                    property: 'imageName'
